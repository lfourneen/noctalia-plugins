id = "lfourneen/waywallen-bridge"
name = "Waywallen Bridge"
version = "1.2.2"
plugin_api = 17
author = "lfourneen"
license = "MIT"
icon = "wallpaper"
description = "Keeps Noctalia's own wallpaper surface out of the way while waywallen draws the background, and syncs Noctalia's colorscheme and previews to waywallen's current wallpaper."
tags = ["wallpaper", "desktop", "theming"]
dependencies = ["waywallen", "ffmpeg"]

# Noctalia's wallpaper switch only creates/destroys Noctalia's own
# "noctalia-wallpaper" layer-shell surface. waywallen draws its own
# "waywallen-wallpaper" surface, so the two stack. This plugin uses
# noctalia.setWallpaperEnabled() - the same hook the official mpvpaper plugin
# uses - to make Noctalia yield those outputs while waywallen is running, and
# noctalia.setWallpaper() to feed Noctalia a still of the live wallpaper so its
# palette generator, templates and lock screen follow it (the W Engine plugin's
# "sync colors" behavior).

[[setting]]
key = "yield_wallpaper"
type = "bool"
label_key = "settings.yield_wallpaper.label"
description_key = "settings.yield_wallpaper.description"
default = true

[[setting]]
key = "require_running"
type = "bool"
label_key = "settings.require_running.label"
description_key = "settings.require_running.description"
default = true

[[setting]]
key = "manage_daemon"
type = "bool"
label_key = "settings.manage_daemon.label"
description_key = "settings.manage_daemon.description"
default = false

[[setting]]
key = "unit"
type = "string"
label_key = "settings.unit.label"
description_key = "settings.unit.description"
default = "waywallen.service"

[[setting]]
key = "poll_seconds"
type = "int"
label_key = "settings.poll_seconds.label"
description_key = "settings.poll_seconds.description"
default = 5
min = 1
max = 60

[[setting]]
key = "sync_colors"
type = "bool"
label_key = "settings.sync_colors.label"
description_key = "settings.sync_colors.description"
default = true

[[setting]]
key = "raise_on_start"
type = "bool"
label_key = "settings.raise_on_start.label"
description_key = "settings.raise_on_start.description"
default = true

[[setting]]
key = "video_seek_seconds"
type = "double"
label_key = "settings.video_seek_seconds.label"
description_key = "settings.video_seek_seconds.description"
default = 1.0
min = 0.0
max = 60.0

# Headless service: the actual arbitration, runs with or without a bar widget.
[[service]]
id = "service"
entry = "service.luau"

# Optional bar widget: shows status and suspends/resumes the arbitration so the
# built-in Noctalia wallpaper switch can be used temporarily.
[[widget]]
id = "widget"
entry = "widget.luau"

  [[widget.setting]]
  key = "glyph"
  type = "glyph"
  label_key = "settings.glyph.label"
  default = "wallpaper"
